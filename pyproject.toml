[project]
name = "legal-ai-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.16.0",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "sentence-transformers>=6.3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "N",    # pep8-naming
]
ignore = [
    "B008",  # FastAPI Depends() в дефолтах — это норма
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]      # assert в тестах
"app/api/**" = ["B008"]    # Depends(...) в аргументах

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false                # начните с false, включите позже
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true # для faiss, sentence_transformers, google.genai
check_untyped_defs = true
no_implicit_optional = true

# Pydantic-плагин понимает BaseModel и настройки
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "sentence_transformers.*",
    "google.genai.*",
    "langgraph.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
